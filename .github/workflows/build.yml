name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nimble install -y "https://github.com/nim-lang/uirelays#a3d31e179d0a6d926e532442cfba2f6c5ab2b2d3"
      - run: nimble buildRelease
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\video-compressor.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: video-compressor-windows-x64
          path: |
            bin/video-compressor.exe
            dist/video-compressor-setup-*-windows-x64.exe
            LICENSE
            THIRD_PARTY_NOTICES.txt
