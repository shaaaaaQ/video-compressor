name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nimble install -d -y
      - run: nimble buildRelease
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\video-compressor.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: video-compressor-windows-x64
          path: |
            bin/video-compressor.exe
            dist/video-compressor-setup-*-windows-x64.exe
            LICENSE
            THIRD_PARTY_NOTICES.txt
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "dist/video-compressor-setup-*-windows-x64.exe" | Select-Object -First 1

          gh release create "${{ github.ref_name }}" `
            "bin/video-compressor.exe" `
            "$($installer.FullName)" `
            "LICENSE" `
            "THIRD_PARTY_NOTICES.txt" `
            --generate-notes
